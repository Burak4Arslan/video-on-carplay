# The Xcode project is generated with XcodeGen: ./generate.sh (uses the team and bundle ID from Config/local.env)
name: VideoOnCarPlay
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${VIDEOONCARPLAY_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
packages:
  # YouTube links: the stream URLs are extracted on the device (no remote server)
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.4.9"
targets:
  VideoOnCarPlay:
    type: application
    platform: iOS
    sources:
      - path: VideoOnCarPlay
        excludes: ["Info.plist"]
    dependencies:
      - package: YouTubeKit
    info:
      path: VideoOnCarPlay/Info.plist
      properties:
        CFBundleDisplayName: Video on CarPlay
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # audio: playing audio is what makes the app "now playing" (and keeps it running while the phone is locked)
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Pick a video to show on the car's screen.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${VIDEOONCARPLAY_BUNDLE_ID}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
